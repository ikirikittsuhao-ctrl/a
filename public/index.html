<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>schat</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
<div id="auth" class="auth-page">
  <div class="auth-card">
    <div class="brand"><span class="brand-mark"><i class="fa-solid fa-comments"></i></span><b>schat</b></div>
    <p class="muted">シンプルで安全なチャット</p>
    <div class="tabs">
      <button id="loginTab" class="active">ログイン</button>
      <button id="signupTab">新規登録</button>
    </div>
    <form id="authForm">
      <input id="email" type="email" placeholder="メールアドレス" autocomplete="email" required>
      <input id="password" type="password" placeholder="パスワード" autocomplete="current-password" minlength="8" required>
      <input id="displayName" class="signupOnly hidden" placeholder="表示名" maxlength="50">
      <button class="primary" type="submit"><i class="fa-solid fa-arrow-right-to-bracket"></i> 続ける</button>
    </form>
    <p id="authMsg" class="message"></p>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <header class="side-head">
      <div class="brand"><span class="brand-mark"><i class="fa-solid fa-comments"></i></span><b>schat</b></div>
      <button id="profileBtn" class="icon-btn" title="プロフィール"><i class="fa-solid fa-user"></i></button>
    </header>
    <div class="search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input id="userSearch" placeholder="ユーザーを検索">
    </div>
    <div id="searchResults" class="search-results"></div>
    <div class="side-title">チャット</div>
    <div id="chatList" class="chat-list"></div>
    <div class="side-actions">
      <button id="newGroup"><i class="fa-solid fa-user-group"></i> グループ</button>
      <button id="qrBtn"><i class="fa-solid fa-qrcode"></i> QRフレンド</button>
      <button id="logout"><i class="fa-solid fa-right-from-bracket"></i> ログアウト</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button id="mobileMenu" class="icon-btn"><i class="fa-solid fa-bars"></i></button>
      <div id="chatTitle"><b>チャットを選択</b><span>メッセージを開始</span></div>
      <button id="mobileProfile" class="icon-btn"><i class="fa-solid fa-user"></i></button>
    </header>
    <section id="messages" class="messages">
      <div class="empty"><i class="fa-regular fa-comments"></i><h2>schatへようこそ</h2><p>左側からチャットを選択してください。</p></div>
    </section>
    <form id="composer" class="composer">
      <input id="messageInput" maxlength="2000" autocomplete="off" placeholder="メッセージを入力..." disabled>
      <button class="send" type="submit" disabled><i class="fa-solid fa-paper-plane"></i></button>
    </form>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <button id="modalClose" class="modal-close"><i class="fa-solid fa-xmark"></i></button>
    <div id="modalContent"></div>
  </div>
</div>
<script src="/config.js"></script>
<script src="/app.js"></script>
</body>
</html>
